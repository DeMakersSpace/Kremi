<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kremi Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --matcha: #5a7a4a;
      --red: #c8392b;
      --cream: #faf6ef;
      --warm-white: #fffdf8;
      --ink: #1a1714;
      --ink-soft: #3d3530;
      --border: rgba(90,122,74,0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(90,122,74,0.09), transparent 34%),
        linear-gradient(180deg, #fcfaf4 0%, #f4efe3 100%);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      padding: 20px;
    }
    .card {
      width: min(560px, 100%);
      background: rgba(255,255,255,0.84);
      border: 1px solid rgba(90,122,74,0.16);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(26,23,20,0.08);
      padding: 30px;
    }
    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--matcha);
      margin: 0 0 10px;
      font-weight: 700;
    }
    h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      line-height: 1.08;
      margin: 0;
    }
    p {
      margin: 12px 0 0;
      color: var(--ink-soft);
      line-height: 1.8;
    }
    label {
      display: block;
      margin: 22px 0 8px;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #786a58;
      font-weight: 700;
    }
    input {
      width: 100%;
      border: 1px solid rgba(90,122,74,0.2);
      border-radius: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.94);
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    input:focus { border-color: rgba(200,57,43,0.45); box-shadow: 0 0 0 4px rgba(200,57,43,0.08); }
    button {
      margin-top: 18px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--red);
      color: white;
      box-shadow: 0 12px 24px rgba(200,57,43,0.2);
    }
    .status {
      margin-top: 14px;
      min-height: 24px;
      color: var(--ink-soft);
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Kremi Admin</p>
    <h1>Sign in to publish seasonal crepes.</h1>
    <p>Use the owner password to unlock the seasonal editor. The browser never sees GitHub credentials.</p>

    <label for="password">Owner password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="login">Sign in</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

  <script>
    const password = document.getElementById('password');
    const statusEl = document.getElementById('status');
    const loginBtn = document.getElementById('login');

    async function login() {
      if (loginBtn.disabled) return;
      statusEl.textContent = 'Checking password...';
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password.value }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        statusEl.textContent = data.error || 'Login failed';
        return;
      }
      window.location.href = '/seasonal-admin.html';
    }

    loginBtn.disabled = true;
    fetch('/api/status', {cache:'no-store'}).then(async response => {
      if (!response.ok || !(response.headers.get('content-type') || '').includes('application/json')) throw new Error('The owner editor runs on your computer. Start the local Kremi server to sign in.');
      const config = await response.json();
      if (!config.editorConfigured) throw new Error('Owner setup is needed. Follow the local editor setup in README.md, then restart the server.');
      loginBtn.disabled = false;
    }).catch(error => {statusEl.textContent = error.message;});

    loginBtn.addEventListener('click', () => login().catch((error) => {
      statusEl.textContent = error.message || 'Login failed';
    }));
    password.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') loginBtn.click();
    });
  </script>
</body>
</html>
